<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Original "rune-hop" mark: three hop dots joined by a zig-zag trail. Not the Bluetooth trademark. -->
  <rect width="64" height="64" rx="14" fill="#05060f"/>
  <polyline points="12,44 24,20 36,40 50,16" fill="none" stroke="#00E5FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="12" cy="44" r="5" fill="#FF2BD6"/>
  <circle cx="36" cy="40" r="4" fill="#00E5FF"/>
  <circle cx="50" cy="16" r="6" fill="#ffffff"/>
</svg>
